{{define "auth/login.html"}}
{{template "header" .}}

<article style="max-width:24rem; margin:4rem auto">
    <h2>Sign in</h2>
    {{if .Error}}<p style="color:var(--pico-color-red-500)">{{.Error}}</p>{{end}}
    <form method="post" action="/login">
        <label>Username
            <input type="text" name="username" value="{{.Username}}" required autofocus autocomplete="username">
        </label>
        <label>Password
            <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button type="submit" style="width:100%">Sign in</button>
    </form>
</article>

{{template "footer" .}}
{{end}}
